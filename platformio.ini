[platformio]
default_envs = station1
; Build output outside ~/Documents (iCloud sync makes .pio builds crawl)
workspace_dir = ~/.platformio/workspaces/station

[station]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 1.9 MB app slots (OTA kept, SPIFFS unused) - default 1.25 MB is ~99% full
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    fastled/FastLED @ ^3.5.0
build_flags =
    -DFIRMWARE_VERSION=\"2.0.0\"
    ; 0 = no ESP32 core log strings: keeps the image under the old 1.25 MB OTA slot
    ; on boards not yet USB-flashed with min_spiffs (our own Serial output is unaffected)
    -DCORE_DEBUG_LEVEL=0

[ota]
upload_protocol = espota
upload_flags = --auth=${sysenv.ESP_OTA_PASSWORD}

[env:station1]
extends = station
build_flags = ${station.build_flags} -DSTATION_ID=1

[env:station2]
extends = station
build_flags = ${station.build_flags} -DSTATION_ID=2

[env:station3]
extends = station
build_flags = ${station.build_flags} -DSTATION_ID=3

[env:station4]
extends = station
build_flags = ${station.build_flags} -DSTATION_ID=4

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11

[env:station1-ota]
extends = env:station1, ota
upload_port = station-1.local

[env:station2-ota]
extends = env:station2, ota
upload_port = station-2.local

[env:station3-ota]
extends = env:station3, ota
upload_port = station-3.local

[env:station4-ota]
extends = env:station4, ota
upload_port = station-4.local
